name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # Backend — restore, build, test (.NET 10)
  # ============================================================================
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./src/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/backend/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --nologo -v q

      - name: Test
        run: dotnet test --no-build --nologo -v q --results-directory ./TestResults

  # ============================================================================
  # Security — fail on known-vulnerable or deprecated packages
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend]
    defaults:
      run:
        working-directory: ./src/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Audit dependencies
        run: |
          set -euo pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee /tmp/vuln.txt
          if grep -qiE '(Critical|High|Moderate|Low)$|has the following vulnerable' /tmp/vuln.txt; then
            echo "::error::Vulnerable packages found."
            exit 1
          fi
          echo "No vulnerable packages."

      - name: Report deprecated packages
        continue-on-error: true
        run: dotnet list package --deprecated --include-transitive

  # ============================================================================
  # Images — amd64 and arm64 built on native runners, then manifested.
  # Emulated cross-builds are slow enough on .NET to be worth avoiding.
  # ============================================================================
  build-amd64:
    name: Build (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/backend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/technologies.fa.integrations:latest-amd64

  build-arm64:
    name: Build (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    needs: [backend, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/backend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/technologies.fa.integrations:latest-arm64

  merge-manifests:
    name: Create Multi-arch Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-amd64, build-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker buildx imagetools create -t ${{ secrets.DOCKERHUB_USERNAME }}/technologies.fa.integrations:latest \
            ${{ secrets.DOCKERHUB_USERNAME }}/technologies.fa.integrations:latest-amd64 \
            ${{ secrets.DOCKERHUB_USERNAME }}/technologies.fa.integrations:latest-arm64

  # ============================================================================
  # Deploy — tell Portainer to re-pull the freshly manifested image
  # ============================================================================
  deploy-portainer:
    name: Re-pull image and redeploy on Portainer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [merge-manifests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Wait for Docker Hub propagation
        run: |
          echo "Sleeping 30s to let Docker Hub propagate the freshly pushed manifest."
          sleep 30

      - name: Trigger Portainer re-pull and redeploy
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
        run: |
          set -euo pipefail
          : "${PORTAINER_URL:?secret PORTAINER_URL is required}"
          : "${PORTAINER_TOKEN:?secret PORTAINER_TOKEN is required}"
          : "${PORTAINER_ENDPOINT_ID:?secret PORTAINER_ENDPOINT_ID is required}"
          : "${PORTAINER_STACK_ID:?secret PORTAINER_STACK_ID is required}"

          api="${PORTAINER_URL%/}/api"

          echo "Fetching current stack file content..."
          stack_file_content=$(curl -fsSL \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            "${api}/stacks/${PORTAINER_STACK_ID}/file" \
            | jq -r '.StackFileContent')

          echo "Fetching current stack metadata..."
          env_array=$(curl -fsSL \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            "${api}/stacks/${PORTAINER_STACK_ID}" \
            | jq -c '.Env // []')

          echo "Submitting update with pullImage=true..."
          body=$(jq -n \
            --arg sfc "${stack_file_content}" \
            --argjson env "${env_array}" \
            '{stackFileContent: $sfc, env: $env, prune: false, pullImage: true}')

          http_code=$(curl -sS -o /tmp/portainer-resp.json -w "%{http_code}" \
            -X PUT "${api}/stacks/${PORTAINER_STACK_ID}?endpointId=${PORTAINER_ENDPOINT_ID}" \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${body}")

          echo "Portainer responded with HTTP ${http_code}"
          if [ "${http_code}" -ge 400 ]; then
            cat /tmp/portainer-resp.json
            exit 1
          fi
          echo "Stack ${PORTAINER_STACK_ID} redeployed successfully."
